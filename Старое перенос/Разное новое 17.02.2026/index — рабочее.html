<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Читалка</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0c0c0c;
  color: white;
  overflow-x: hidden;
}

/* ================= HERO ================= */

.header {
  position: relative;
  min-height: 100vh;
  padding: 20px 20px 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.header video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.header::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 5px;
  text-align: center;
}

/* ================= CAROUSEL ================= */

.carousel-container {
  width: 100%;
  max-width: 1400px;
  overflow-x: auto;
  display: flex;
  cursor: grab;
  scrollbar-width: none;
}
.carousel-container::-webkit-scrollbar { display: none; }

.carousel {
  display: flex;
  gap: 35px;
  padding: 10px 10px 20px;
}

/* ================= BOOK ================= */

.book-card {
  position: relative;
  width: 260px;
  aspect-ratio: 2 / 3;
  perspective: 1400px;
  flex: 0 0 auto;
  transition: transform 0.35s ease;
}

/* ПОДЛОЖКА (СТРАНИЦЫ) */
.book-pages {
  position: absolute;
  inset: 3px 3px 3px 3px; /* меньше, чтобы не выглядывала */
  border-radius: 14px;
  background: linear-gradient(
    to right,
    #d7d2c8 0%,
    #eeeae3 50%,
    #d7d2c8 100%
  );
  z-index: 0;
}

/* ОБЛОЖКА */
.book-cover {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
  transform-origin: left center;
  transform-style: preserve-3d;
  filter: brightness(0.85);
  transition:
    transform 0.45s ease,
    filter 0.3s ease;
  z-index: 1;
}

/* HOVER — ПК */
.book-card:hover {
  transform: translateZ(20px);
}

.book-card:hover .book-cover {
  transform: rotateY(-18deg) translateX(3px);
  filter: brightness(1);
}

/* ================= LINKS ================= */

.sidebar-buttons {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  justify-content: center;
}

.sidebar-button {
  padding: 8px 18px;
  border: 1px solid white;
  border-radius: 25px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.sidebar-button:hover {
  background: white;
  color: black;
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  h1 {
    font-size: 1.8rem;
  }

  .carousel-container {
    scroll-snap-type: x mandatory;
  }

  .book-card {
    width: 85vw;
    scroll-snap-align: center;
  }

  /* TAP — мобильный эффект */
  .book-card:active {
    transform: translateZ(18px);
  }

  .book-card:active .book-cover {
    transform: rotateY(-16deg);
    filter: brightness(1);
  }
}
</style>
</head>

<body>

<div class="header">

  <video autoplay loop muted playsinline>
    <source src="your-starry-sky-video.mp4" type="video/mp4">
  </video>

  <h1>Выберите книгу для чтения</h1>

  <div class="carousel-container" id="carousel">
    <div class="carousel">

      <!-- 15 КНИГ -->
      <!-- Просто меняй картинки -->

      <!-- JS не нужен -->
      <!-- book-cover_1.jpg ... book-cover_15.jpg -->

      <!-- КНИГИ -->
      <script>
        for(let i=1;i<=15;i++){
          document.write(`
          <div class="book-card" onclick="location.href='book.html?book=${i}'">
            <div class="book-pages"></div>
            <div class="book-cover" style="background-image:url('images/book-cover_${i}.jpg')"></div>
          </div>
          `);
        }
      </script>

    </div>
  </div>

  <div class="sidebar-buttons">
    <a class="sidebar-button" href="#">Boosty</a>
    <a class="sidebar-button" href="#">Telegram</a>
    <a class="sidebar-button" href="#">Rulate</a>
  </div>

</div>

<script>
const container = document.getElementById('carousel');
let isDown=false,startX,scrollLeft;

container.addEventListener('mousedown',e=>{
  isDown=true;
  startX=e.pageX;
  scrollLeft=container.scrollLeft;
});

container.addEventListener('mouseup',()=>isDown=false);
container.addEventListener('mouseleave',()=>isDown=false);

container.addEventListener('mousemove',e=>{
  if(!isDown) return;
  e.preventDefault();
  container.scrollLeft = scrollLeft - (e.pageX - startX);
});

container.addEventListener('wheel',e=>{
  e.preventDefault();
  container.scrollLeft += e.deltaY;
},{passive:false});
</script>

</body>
</html>
