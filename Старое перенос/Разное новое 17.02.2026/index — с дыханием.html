<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книги</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    background:#0c0c0c;
    color:#fff;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* ===== HERO ===== */

.hero {
    position:relative;
    padding:40px 20px 20px;
    text-align:center;
    overflow:hidden;
}

.hero video {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.hero::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.55),
        rgba(12,12,12,0.9)
    );
    z-index:-1;
}

.hero h1 {
    font-size:2.3rem;
    margin-bottom:18px; /* КОНТРОЛЬНЫЙ отступ */
}

/* ===== BOOKS ===== */

.books-section {
    padding:0 40px 10px;
}

.carousel-container {
    display:flex;
    gap:34px;
    overflow-x:auto;
    padding:10px 0;
    cursor:grab;

    -ms-overflow-style:none;
    scrollbar-width:none;
}
.carousel-container::-webkit-scrollbar {
    display:none;
}

/* ===== BOOK CARD ===== */

.carousel-item {
    position:relative;
    flex:0 0 auto;
    width:260px;
    aspect-ratio:2/3;
}

/* Подложка страниц — СТАТИЧНАЯ */
.carousel-item::before {
    content:"";
    position:absolute;
    inset:0;
    border-radius:14px;
    background:linear-gradient(
        to right,
        rgba(240,236,228,0.35),
        rgba(220,215,205,0.35)
    );
    z-index:0;
}

/* Обложка */
.carousel-item img {
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:14px;
    filter:brightness(0.75);
    transition:
        transform 0.4s ease,
        filter 0.4s ease;
}

/* ===== ACTIVE EFFECT ===== */

.carousel-item.active img {
    transform:
        perspective(1000px)
        rotateY(-14deg)
        translateX(-6px)
        scale(1.04);
    filter:brightness(1);
}

/* ===== BUTTONS ===== */

.sidebar-buttons {
    display:flex;
    justify-content:center;
    gap:18px;
    padding:20px 20px 30px;
    flex-wrap:wrap;
}

.sidebar-button {
    padding:9px 22px;
    border:1px solid white;
    border-radius:30px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.sidebar-button:hover {
    background:white;
    color:black;
}

/* ===== MOBILE ===== */

@media (max-width:768px){

    .books-section {
        padding:0 20px;
    }

    .carousel-container {
        gap:18px;
    }

    .carousel-item {
        width:180px;
    }
}
</style>
</head>

<body>

<section class="hero">
    <video autoplay muted loop playsinline poster="preview.jpg">
        <source src="your-video.mp4" type="video/mp4">
    </video>
    <h1>Выберите книгу для чтения</h1>
</section>

<section class="books-section">
    <div class="carousel-container">

      <div class="carousel-item" onclick="window.location.href='book.html?book=Book1'"><img src="images/book-cover_1.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book2'"><img src="images/book-cover_2.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book3'"><img src="images/book-cover_3.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book4'"><img src="images/book-cover_4.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book5'"><img src="images/book-cover_5.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book6'"><img src="images/book-cover_6.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book7'"><img src="images/book-cover_7.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book8'"><img src="images/book-cover_8.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book9'"><img src="images/book-cover_9.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book10'"><img src="images/book-cover_10.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book11'"><img src="images/book-cover_11.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book12'"><img src="images/book-cover_12.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book13'"><img src="images/book-cover_13.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book14'"><img src="images/book-cover_14.jpg"></div>
      <div class="carousel-item" onclick="window.location.href='book.html?book=Book15'"><img src="images/book-cover_15.jpg"></div>

    </div>
</section>

<div class="sidebar-buttons">
    <a href="#" class="sidebar-button">Boosty</a>
    <a href="#" class="sidebar-button">Rulate</a>
    <a href="#" class="sidebar-button">Telegram</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const container = document.querySelector('.carousel-container');
    const items = document.querySelectorAll('.carousel-item');

    /* ===== wheel ===== */
    container.addEventListener('wheel', e => {
        e.preventDefault();
        container.scrollLeft += e.deltaY * 1.2;
    }, { passive:false });

    /* ===== drag ===== */
    let isDown = false;
    let startX, scrollLeft;

    container.addEventListener('mousedown', e => {
        isDown = true;
        startX = e.clientX;
        scrollLeft = container.scrollLeft;
        container.style.cursor = "grabbing";
    });

    window.addEventListener('mouseup', () => {
        isDown = false;
        container.style.cursor = "grab";
    });

    container.addEventListener('mousemove', e => {
        if (!isDown) return;
        container.scrollLeft = scrollLeft - (e.clientX - startX);
    });

    /* ===== hover / tap ===== */
    items.forEach(item => {

        item.addEventListener('mouseenter', () => {
            items.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        });

        item.addEventListener('touchstart', () => {
            items.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        });

    });

});
</script>

</body>
</html>
