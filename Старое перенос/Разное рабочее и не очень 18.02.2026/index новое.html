* {

body {

  background: #0c0c0c;

/* ================== NAVBAR ================== */

.navbar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.navbar .sidebar-buttons {
  justify-content: flex-start;
}

.nav-logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 1px;
  opacity: 0.9;
}

/* ================== HERO ================== */

.header {
  position: relative;
  min-height: 100vh;
  padding: 80px 20px 30px; /* место под navbar */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.header video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.header::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.6rem;
  text-align: center;
  background: linear-gradient(90deg, #ffb347, #ffcc33);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  margin-bottom: 10px;
}

/* ================== CAROUSEL ================== */

.carousel-container {
  width: 100%;
  max-width: 1400px;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  cursor: pointer;
  scrollbar-width: none;
}

.carousel-container::-webkit-scrollbar {
  display: none;
}

.carousel {
  display: flex;
  gap: 35px;
  padding: 10px 10px 20px;
}

/* ================== BOOK CARD ================== */

.book-card {
  position: relative;
  width: 260px;
  aspect-ratio: 2 / 3;
  perspective: 1200px;
  flex: 0 0 auto;
  transition: transform 0.35s ease;
}

.book-pages {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(
    to right,
    #d9d5cc 0%,
    #f1eee9 25%,
    #f1eee9 75%,
    #d9d5cc 100%
  );
  box-shadow:
    inset -3px 0 6px rgba(0,0,0,0.2),
    0 8px 20px rgba(0,0,0,0.6);
}

.book-cover {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.45s ease, filter 0.3s ease;
  filter: brightness(0.85);
}

.book-card:hover .book-cover {
  transform: rotateY(-18deg);
  filter: brightness(1);
}

@keyframes breathe {
  0%, 100% { transform: translateZ(0) rotateY(0deg); }
  50% { transform: translateZ(6px) rotateY(1deg); }
}

.book-card:hover {
  animation: breathe 1.5s ease-in-out infinite;
}

/* ================== LINKS ================== */

.sidebar-buttons {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.sidebar-button {
  padding: 8px 18px;
  border: 1px solid white;
  border-radius: 25px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.sidebar-button:hover {
  background: white;
  color: black;
}

/* ================== MOBILE ================== */

@media (max-width: 768px) {
  h1 {
    font-size: 1.8rem;
  }

  .carousel-container {
    scroll-snap-type: x mandatory;
  }

  .carousel {
    gap: 20px;
  }

  .book-card {
    width: 85vw;
    scroll-snap-align: center;
  }
}
</style>
