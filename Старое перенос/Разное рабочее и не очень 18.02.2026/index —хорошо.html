<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMA TRANSLATE — библиотека</title>

<!-- Стильный шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0c0c0c;
  color: white;
  overflow-x: hidden;
}

/* ================== HERO ================== */

.header {
  position: relative;
  min-height: 100vh;
  padding: 25px 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.header video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.header::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* Логотип и соцсети сверху */
.top-bar {
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}

.logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.6rem;
  background: linear-gradient(90deg, #ffb347, #ffcc33);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

.social-links {
  display: flex;
  gap: 15px;
}

.social-links a {
  padding: 6px 14px;
  border: 1px solid white;
  border-radius: 25px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
  font-size: 0.9rem;
}

.social-links a:hover {
  background: white;
  color: black;
}

/* Стильная надпись */
h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.6rem;
  text-align: center;
  background: linear-gradient(90deg, #ffb347, #ffcc33);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  margin-bottom: 10px;
}

/* ================== CAROUSEL ================== */

.carousel-container {
  width: 100%;
  max-width: 1400px;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  cursor: pointer; /* обычная рука */
  scrollbar-width: none;
}
.carousel-container::-webkit-scrollbar {
  display: none;
}

.carousel {
  display: flex;
  gap: 35px;
  padding: 10px 10px 20px;
}

/* ================== BOOK CARD ================== */

.book-card {
  position: relative;
  width: 260px;
  aspect-ratio: 2 / 3;
  perspective: 1200px;
  flex: 0 0 auto;
  transition: transform 0.35s ease;
}

/* ПОДЛОЖКА — СТРАНИЦЫ */
.book-pages {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(
    to right,
    #d9d5cc 0%,
    #f1eee9 25%,
    #f1eee9 75%,
    #d9d5cc 100%
  );
  box-shadow:
    inset -3px 0 6px rgba(0,0,0,0.2),
    0 8px 20px rgba(0,0,0,0.6);
}

/* ОБЛОЖКА */
.book-cover {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.45s ease, filter 0.3s ease;
  filter: brightness(0.85);
}

/* HOVER — ПРИОТКРЫТИЕ */
.book-card:hover .book-cover {
  transform: rotateY(-18deg);
  filter: brightness(1);
}

/* ЭФФЕКТ "ДЫХАНИЯ" */
@keyframes breathe {
  0%, 100% { transform: translateZ(0) rotateY(0deg); }
  50% { transform: translateZ(6px) rotateY(1deg); }
}

.book-card:hover {
  animation: breathe 1.5s ease-in-out infinite;
}

/* ================== MOBILE ================== */

@media (max-width: 768px) {

  /* ===== HEADER ===== */
  .header {
    padding-top: 110px; /* место под навигацию */
    justify-content: flex-start;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  /* ===== LOGO ===== */
  .logo {
    font-size: 1.25rem;
    white-space: nowrap;
  }

  /* ===== SOCIAL LINKS UNDER LOGO ===== */
  .social-links {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
  }

  .social-links a {
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  /* ===== TITLE ===== */
  h1 {
    margin-top: 24px;
    margin-bottom: 24px;
    font-size: 1.6rem;
    text-align: center;
  }

  /* ===== CAROUSEL CENTERING ===== */
  .carousel-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-type: x mandatory;
  }

  .carousel {
    gap: 20px;
  }

  .book-card {
    width: 82vw;
    scroll-snap-align: center;
  }

  /* hover-замена для тача */
  .book-card:active .book-cover {
    transform: rotateY(-18deg);
  }
}

</style>
</head>

<body>

      <div class="book-card" data-book="Book15">

<script>
const container = document.getElementById('carousel-container');
const carousel = document.getElementById('carousel');

// Список оригинальных карточек
let cards = Array.from(document.querySelectorAll('.book-card'));

// =========================
// 1. КЛОНИРУЕМ КАРТОЧКИ
// =========================

// Копии в начало (в обратном порядке)
const clonesBefore = cards.slice().reverse().map(card => card.cloneNode(true));
clonesBefore.forEach(clone => carousel.insertBefore(clone, carousel.firstChild));

// Копии в конец (как есть)
const clonesAfter = cards.map(card => card.cloneNode(true));
clonesAfter.forEach(clone => carousel.appendChild(clone));

// Обновляем массив всех карточек
cards = Array.from(document.querySelectorAll('.book-card'));

// Размеры
const originalCount = cards.length / 3; // три блока: before + original + after
const cardStyle = getComputedStyle(cards[0]);
const gap = parseInt(cardStyle.marginRight || 35); // расстояние между карточками
const cardWidth = cards[0].offsetWidth + gap;
const originalWidth = originalCount * cardWidth;

// Ставим скролл на середину (на оригинальные карточки)
container.scrollLeft = originalWidth;

// =========================
// 2. ЗАЦИКЛИВАНИЕ В ОБЕ СТОРОНЫ
// =========================
container.addEventListener('scroll', () => {
  if (container.scrollLeft <= 0) {
    container.scrollLeft += originalWidth;
  } else if (container.scrollLeft >= originalWidth * 2) {
    container.scrollLeft -= originalWidth;
  }
});

// =========================
// 3. DRAG СКРОЛЛ
// =========================
let isDown = false;
let startX;
let scrollStart;

container.addEventListener('mousedown', e => {
  isDown = true;
  startX = e.pageX - container.offsetLeft;
  scrollStart = container.scrollLeft;
  cards.forEach(c => c.isDragging = false);
});

container.addEventListener('mouseleave', () => isDown = false);
container.addEventListener('mouseup', () => isDown = false);

container.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - container.offsetLeft;
  const walk = x - startX;
  container.scrollLeft = scrollStart - walk;
  cards.forEach(c => c.isDragging = true);
});

// =========================
// 4. КЛИК ПО КАРТОЧКЕ
// =========================
cards.forEach(card => {
  card.addEventListener('click', () => {
    if (!card.isDragging) {
      const book = card.dataset.book;
      if (book) {
        window.location.href = `book.html?book=${book}`;
      }
    }
  });
});

// =========================
// 5. ИНЕРЦИЯ КОЛЕСИКОМ
// =========================
let scrollVelocity = 0;
let rafId = null;

container.addEventListener('wheel', e => {
  e.preventDefault();
  scrollVelocity += e.deltaY * 0.5;
  if (!rafId) rafId = requestAnimationFrame(smoothScroll);
}, { passive: false });

function smoothScroll() {
  container.scrollLeft += scrollVelocity;
  scrollVelocity *= 0.85;
  if (Math.abs(scrollVelocity) > 0.5) {
    rafId = requestAnimationFrame(smoothScroll);
  } else {
    rafId = null;
    scrollVelocity = 0;
    snapToCenter(); // Магнит к центру после инерции
  }
}

// =========================
// 6. МАГНИТ К ЦЕНТРУ
// =========================
function snapToCenter() {
  // Находим ближайшую карточку к центру контейнера
  const containerCenter = container.scrollLeft + container.offsetWidth / 2;
  let minDiff = Infinity;
  let targetScroll = container.scrollLeft;

  cards.forEach(card => {
    const cardCenter = card.offsetLeft + card.offsetWidth / 2;
    const diff = Math.abs(cardCenter - containerCenter);
    if (diff < minDiff) {
      minDiff = diff;
      targetScroll = cardCenter - container.offsetWidth / 2;
    }
  });

  // Плавно скроллим к ближайшей карточке
  container.scrollTo({
    left: targetScroll,
    behavior: 'smooth'
  });
}

// Магнит к центру после drag
container.addEventListener('mouseup', snapToCenter);
container.addEventListener('touchend', snapToCenter);

</script>
