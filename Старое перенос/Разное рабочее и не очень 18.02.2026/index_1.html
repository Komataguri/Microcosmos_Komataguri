<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koma Translate — библиотека</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0c0c0c;
  color: white;
  overflow-x: hidden;
}

/* ================== NAV ================== */
header {
  position: relative;
  z-index: 10;
}

.navbar {
  width: 100%;
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
}

.nav-logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
}

.nav-links {
  display: flex;
  gap: 16px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.4);
  font-size: 0.85rem;
  transition: 0.3s;
}

.nav-links a:hover {
  background: white;
  color: black;
}

/* ================== HERO ================== */
.hero {
  position: relative;
  min-height: calc(100vh - 60px);
  padding: 25px 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

.hero-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.6rem;
  text-align: center;
  background: linear-gradient(90deg, #ffb347, #ffcc33);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

/* ================== CONTINUE ================== */
.continue {
  margin-bottom: 12px;
  display: none;
}

.continue button {
  padding: 10px 26px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(90deg, #ffb347, #ffcc33);
  color: black;
  font-weight: bold;
  cursor: pointer;
}

/* ================== CAROUSEL ================== */
.carousel-container {
  width: 100%;
  max-width: 1400px;
  overflow-x: auto;
  display: flex;
  scrollbar-width: none;
}

.carousel-container::-webkit-scrollbar {
  display: none;
}

.carousel {
  display: flex;
  gap: 35px;
  padding: 10px 10px 20px;
}

/* ================== BOOK CARD ================== */
.book-card {
  position: relative;
  width: 260px;
  aspect-ratio: 2 / 3;
  perspective: 1200px;
  flex: 0 0 auto;
  transition: transform 0.35s ease;
}

.book-card.read .book-cover {
  filter: brightness(0.55);
}

.book-card.read::after {
  content: "✓";
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 1.4rem;
  color: #ffcc33;
}

.book-pages {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(
    to right,
    #d9d5cc 0%,
    #f1eee9 25%,
    #f1eee9 75%,
    #d9d5cc 100%
  );
  box-shadow:
    inset -3px 0 6px rgba(0,0,0,0.2),
    0 8px 20px rgba(0,0,0,0.6);
}

.book-cover {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
  transform-origin: left center;
  transition: transform 0.45s ease, filter 0.3s ease;
  filter: brightness(0.85);
}

.book-card:hover .book-cover {
  transform: rotateY(-18deg);
  filter: brightness(1);
}

/* ================== MOBILE ================== */
@media (max-width: 768px) {
  .hero-title {
    font-size: 1.8rem;
  }

  .book-card {
    width: 85vw;
  }
}
</style>
</head>

<body>

<header>
  <nav class="navbar">
    <div class="nav-logo">KOMA TRANSLATE</div>
    <div class="nav-links">
      <a href="https://boosty.to/komataguri" target="_blank">Boosty</a>
      <a href="https://t.me/micro_koma" target="_blank">Telegram</a>
    </div>
  </nav>
</header>

<main>
<section class="hero">

  <video autoplay loop muted playsinline>
    <source src="your-starry-sky-video.mp4" type="video/mp4">
  </video>

  <h1 class="hero-title">Ваша библиотека</h1>

  <div class="continue" id="continueBlock">
    <button id="continueBtn">Продолжить чтение</button>
  </div>

  <div class="carousel-container" id="carousel-container">
    <div class="carousel">

      <div class="book-card" data-book="Book1">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_1.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book2">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_2.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book3">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_3.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book4">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_4.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book5">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_5.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book6">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_6.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book7">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_7.jpg')"></div>
      </div>

      <div class="book-card" data-book="Book8">
        <div class="book-pages"></div>
        <div class="book-cover" style="background-image:url('images/book-cover_8.jpg')"></div>
      </div>

    </div>
  </div>

</section>
</main>

<script>
const cards = document.querySelectorAll('.book-card');
const continueBlock = document.getElementById('continueBlock');
const continueBtn = document.getElementById('continueBtn');

const progress = JSON.parse(localStorage.getItem('readingProgress') || '{}');

// Визуальное состояние
cards.forEach(card => {
  const book = card.dataset.book;
  if(progress[book]) {
    card.classList.add('read');
  }

  card.addEventListener('click', () => {
    localStorage.setItem('lastBook', book);
    window.location.href = `book.html?book=${book}`;
  });
});

// Кнопка продолжения
const lastBook = localStorage.getItem('lastBook');
if(lastBook) {
  continueBlock.style.display = 'block';
  continueBtn.onclick = () => {
    window.location.href = `book.html?book=${lastBook}`;
  };
}
</script>

</body>
</html>
