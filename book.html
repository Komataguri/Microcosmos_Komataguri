<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Онлайн-читалка переводов KOMA TRANSLATE">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Загрузка книги...</title>

  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/book.css">
  <link rel="stylesheet" href="styles/theme.css">
</head>

<body>
  <header class="book-header">
    <div class="container">
      <img src="images/book-cover_1.jpg" alt="Обложка книги" class="book-cover">
      <div class="book-info"></div>
    </div>
  </header>

  <section class="toc-section">
    <h3>Содержание:</h3>
    <ul class="table-of-contents" id="toc-list"></ul>
  </section>

  <div class="loader" id="loader" role="status" aria-label="Загрузка" hidden></div>

  <main id="chapter-container" hidden>
    <div class="chapter-content" id="chapter-content"></div>
  </main>

  <button class="nav-sticker" id="themeSticker" type="button" aria-label="Сменить тему">☯</button>
  <div class="nav-sticker" id="fontControls" role="group" aria-label="Размер текста">
    <div class="font-controls-container">
      <button class="font-btn" id="fontInc" type="button" aria-label="Увеличить текст">A+</button>
      <button class="font-btn" id="fontDec" type="button" aria-label="Уменьшить текст">A−</button>
      <button class="font-btn" id="fontReset" type="button" aria-label="Сбросить размер текста">↺</button>
    </div>
  </div>
  <button class="nav-sticker" id="homeSticker" type="button" aria-label="На главную">⌂</button>
  <button class="nav-sticker" id="prevSticker" type="button" aria-label="Предыдущая глава">←</button>
  <button class="nav-sticker" id="tocSticker" type="button" aria-label="Оглавление">≡</button>
  <button class="nav-sticker" id="nextSticker" type="button" aria-label="Следующая глава">→</button>
  <button class="nav-sticker" id="scrollSticker" type="button" aria-label="В конец страницы">↓</button>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-brand">KOMA TRANSLATE</div>
    <nav class="footer-links" aria-label="Контакты и документы">
      <a href="https://boosty.to/komataguri" target="_blank" rel="noopener">Boosty</a>
      <a href="https://tl.rulate.ru/users/209811" target="_blank" rel="noopener">Rulate</a>
      <a href="https://t.me/micro_koma" target="_blank" rel="noopener">Telegram</a>
      <a href="privacy.html">Политика конфиденциальности</a>
    </nav>
    <p>© <span data-current-year>2026</span> KOMA TRANSLATE</p>
  </footer>

  <script src="scripts/vendor/marked.umd.js"></script>
  <script src="scripts/books.js"></script>
  <script src="scripts/book.js"></script>
  <script src="scripts/footer.js"></script>
</body>
</html>
